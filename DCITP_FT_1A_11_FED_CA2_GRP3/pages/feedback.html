<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCompass | Feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/script.js" defer></script>
</head>
<body class="d-flex flex-column m-0">
    <header class="d-flex justify-content-between">
        <h1 class="m-4 text-white">SGCompass</h1>

        <nav class="d-flex align-items-center gap-4 me-5">
            <a class="fs-5" href="../index.html">Home</a>
            <a class="fs-5" href="tools.html">Tools</a>
            <a class="fs-5 text-decoration-underline" href="feedback.html">Feedback</a>
        </nav>
    </header>

    <div id="banner1" data-image-path="../assets/img"></div>

    <main class="m-4">
        <h3>Feedback Form</h3>
        <form id="feedbackForm" novalidate class="m-4 p-4">

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" placeholder="Enter your name" class="form-control" id="name">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" placeholder="Enter your email" class="form-control" id="email">
                <div class="invalid-feedback">
                    Please enter your email.
                </div>
            </div>

            <!-- Suggestion -->
            <div class="mb-3">
                <label class="form-label">Suggestion</label>
                <textarea class="form-control" placeholder="Enter your suggestions" id="suggestion" rows="4"></textarea>
            </div>

            <!-- Question -->
            <div class="mb-3">
                <label class="form-label">Question</label>
                <textarea class="form-control" placeholder="Enter your questions" id="question" rows="4"></textarea>
            </div>

            <!-- Error -->
            <div
                id="messageError"
                class="text-danger mb-3 d-none">
                Please enter either a suggestion or a question.
            </div>

            <button class="btn btn-primary" type="submit">
                Submit
            </button>

        </form>

        <p
            id="successMessage"
            class="text-success mt-3 d-none">
            Successfully submitted!
        </p>
    </main>

    <footer class="p-5">
        <p class="text-white">© 2026 SGCompass</p>
    </footer>
</body>
</html>
