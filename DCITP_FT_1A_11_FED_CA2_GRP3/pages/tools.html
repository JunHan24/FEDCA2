<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCompass | Tools</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/script.js" defer></script>
</head>
<body class="d-flex flex-column m-0">
    <header class="d-flex justify-content-between">
        <h1 class="m-4 text-white">SGCompass</h1>

        <nav class="d-flex align-items-center gap-4 me-5">
            <a class="fs-5" href="../index.html">Home</a>
            <a class="fs-5 text-decoration-underline" href="tools.html">Tools</a>
            <a class="fs-5" href="feedback.html">Feedback</a>
        </nav>
    </header>

    <div id="banner1" data-image-path="../assets/img"></div>

    <main class="m-4">
               <!-- Singapore Local Time -->
        <section id="sgClockCard" class="mb-4">
            <h2 class="mb-3">Singapore Time</h2>
            <div class="sg-clock-card d-flex flex-column align-items-center justify-content-center mx-auto">
                <p class="sg-clock-label mb-1">Local Time · Singapore</p>
                <h2 id="sgClockTime" class="sg-clock-time mb-1">--:-- --</h2>
                <p id="sgClockDate" class="sg-clock-date mb-0">Loading...</p>
            </div>
        </section>
 <!-- Currency Converter -->
        <section id="currencyCard" class="mb-4">
            <h2 class="mb-3">Currency Converter</h2>
            <div class="currency-card mx-auto">
                <p class="currency-label mb-3">Convert to Singapore Dollar</p>

                <div class="d-flex flex-wrap align-items-center justify-content-center gap-3">
                    <div class="currency-input-group">
                        <input type="number" id="currencyAmount" class="currency-input" value="100" min="0" step="any" inputmode="decimal">
                        <select id="currencyFrom" class="currency-select">
                            <option value="USD" selected>USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="AUD">AUD</option>
                            <option value="JPY">JPY</option>
                            <option value="CNY">CNY</option>
                            <option value="MYR">MYR</option>
                            <option value="INR">INR</option>
                            <option value="IDR">IDR</option>
                            <option value="HKD">HKD</option>
                        </select>
                    </div>

                    <span class="currency-arrow">&#8594;</span>

                    <div class="currency-result-group">
                        <span id="currencyResult" class="currency-result">--</span>
                        <span class="currency-sgd">SGD</span>
                    </div>
                </div>

                <p id="currencyRateNote" class="currency-rate-note mt-3 mb-0">Loading exchange rate…</p>
            </div>
        </section>


        <section id="weather-tool" class="mb-5">
            <h2 class="mb-3">Singapore Weather Forecast</h2>

            <!-- Current weather card -->
            <div id="weather-current" class="p-4 mb-4 rounded-3 d-flex flex-wrap align-items-center justify-content-between" style="background-color:#0F6B72; color:#ffffff;">
                <div class="d-flex align-items-center gap-3">
                    <img id="weather-current-icon" src="" alt="" width="64" height="64" style="display:none;">
                    <div>
                        <p class="fs-4 mb-0 fw-bold">Singapore</p>
                        <p id="weather-current-desc" class="mb-0">Loading forecast…</p>
                    </div>
                </div>
                <div class="text-end">
                    <p id="weather-current-temp" class="display-5 fw-bold mb-0">--°C</p>
                    <p id="weather-current-updated" class="mb-0 small">&nbsp;</p>
                </div>
            </div>

            <!-- Forecast row -->
            <div id="weather-forecast" class="row weather-row g-3 text-center">
                <p id="weather-forecast-placeholder" class="text-muted">Forecast loading…</p>
            </div>

        </section>

    </main>

    <footer class="p-5">
        <p class="text-white">© 2026 SGCompass</p>
    </footer>
</body>
</html>
